<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQL Lab · Learn SQL &amp; Microsoft SQL Server</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232b59c3'/><text x='16' y='22' font-size='14' text-anchor='middle' fill='white' font-family='Segoe UI,Arial' font-weight='700'>SQL</text></svg>">
  <link rel="stylesheet" href="vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>
    <a class="brand" href="#welcome"><span class="logo">SQL</span> Lab</a>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Checking connection…</span></div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" id="setupBtn" title="Create or reset the ShopDB practice database">Set up practice database</button>
      <a class="btn btn-ghost" href="#playground">Playground</a>
      <div class="progress-pill" id="progressPill" title="Lessons visited · exercises passed"></div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <input class="search" id="search" type="search" placeholder="Search lessons…" autocomplete="off">
      <nav id="nav"></nav>
    </aside>
    <main class="content" id="content"></main>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><h3 id="modalTitle"></h3><button class="btn btn-ghost" id="modalClose">Close</button></div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- bundled locally so the app works offline -->
  <script src="vendor/codemirror/codemirror.js"></script>
  <script src="vendor/codemirror/sql.js"></script>
  <script src="vendor/codemirror/matchbrackets.js"></script>
  <script src="vendor/mermaid.min.js"></script>

  <script src="lessons/01-start.js"></script>
  <script src="lessons/02-design.js"></script>
  <script src="lessons/03-sql.js"></script>
  <script src="lessons/04-mssql.js"></script>
  <script src="lessons/05-practice.js"></script>
  <script src="lessons/06-beginner.js"></script>
  <script src="app.js"></script>
</body>
</html>
